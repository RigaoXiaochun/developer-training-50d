name: Engineering training
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**']
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: '任务编号 Q01–Q20。留空时执行基础检查。'
        required: false
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - id: lesson
        name: Verify task branch
        env:
          REQUESTED: ${{ inputs.task }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { BRANCH, REQUESTED, FORK_PR, GITHUB_OUTPUT } = process.env;
          const branchTask = BRANCH.match(/^(?:feat|fix|refactor)\/(q\d{2})-/)?.[1]?.toUpperCase();
          const task = REQUESTED || branchTask || 'smoke';
          const { tasks } = JSON.parse(readFileSync('course/tasks.json', 'utf8'));
          if (task !== 'smoke' && !tasks.some(({ id }) => id === task)) {
            throw new Error('任务编号应为 Q01 至 Q20。');
          }
          if (FORK_PR === 'true' && !tasks.some((item) => item.id === task && item.branch === BRANCH)) {
            throw new Error('提交培训 PR 时，请使用任务书指定的分支名。');
          }
          appendFileSync(GITHUB_OUTPUT, `task=${task}\n`);
          JS
      - run: npm ci
      - run: npm run check:base && npm test && npm run typecheck && npm run build
      - name: Core and evidence
        if: steps.lesson.outputs.task != 'smoke'
        env:
          QID: ${{ steps.lesson.outputs.task }}
        run: |
          npm run check:task -- "$QID"
          npm run test:learner
          npm run test:acceptance -- "$QID"
      - run: npx playwright install --with-deps chromium
      - name: Browser
        env:
          QID: ${{ steps.lesson.outputs.task }}
        run: npm run check:ui -- "$QID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-results
          path: |
            playwright-report
            test-results
            .local/checks
          if-no-files-found: ignore
